server_config:
    use_dummy: false # set to false to use the real AI model
    default_grade_level: "8"
    default_interest: "General"
    translate_to_nepali: false # set true to translate final AI responses to Nepali

cache_config:
    enabled: true
    ttl: 3600 # seconds; 0 = no expiry
    provider: memory # future: redis, file
    preload_enabled: false
    # preload_file: config/preload_cache.yaml # optional; omit or set null to skip preload

chat_model_config:
    # provider: groq
    # model: llama-3.1-8b-instant
    provider: google
    model: gemini-3.1-flash-lite
    kwargs:
        temperature: 0.75

prompts_config:
    # system_prompt_file: prompts/meta.txt # prompt based on meta strategy (https://github.com/meta-prompting/meta-prompting?tab=readme-ov-file)
    system_prompt_file: prompts/dynamic.md # dynamic prompt
    example_prompt_file: prompts/dynamic_example.md # appended when include_example=True
    # system_prompt_file: prompts/simple.txt # simple prompt
    # system_prompt_file: prompts/original.txt # original prompt
