grade_rules:
  - start: 0
    end: 4
    rules: |
      - **Audience:** Ages 10-12. Struggling readers / Beginner ESL.
      - **Vocabulary:** Ultra-simple, everyday words. No jargon. If a technical term from the card must stay, define it immediately using words a 7-year-old knows.
      - **Sentence Structure:** Maximum 10-12 words. One tiny, isolated idea per sentence. Use bullet points if the original card lists things.
      - **Tone/Voice:** Direct, conversational, and active (e.g., "People do X"). Avoid all abstract phrasing. Keep the exact facts, but state them bluntly.
  - start: 5
    end: 6
    rules: |
      - **Audience:** Ages 11-13. Below-average literacy / Intermediate ESL.
      - **Vocabulary:** Keep text simple. Limit technical terms to the absolute essentials from the original card, and surround them with heavy context clues.
      - **Sentence Structure:** Maximum 15 words. Use only basic connectors ("and", "but", "so"). Avoid long, winding sentences. 
      - **Tone/Voice:** Active voice. Bold key words to help them scan the text. Keep cause-and-effect strictly linear (e.g., "This happens, so that happens").
  - start: 7
    end: 10
    rules: |
      - **Audience:** Ages 13-16. Below-average literacy / Intermediate-Advanced ESL.
      - **Vocabulary:** Use the original card's subject terms, but swap out any unnecessary "big words" or complex phrasing for simpler alternatives.
      - **Sentence Structure:** Maximum 20 words. Keep clauses predictable and straightforward. Use basic transition words ("however", "as a result").
      - **Tone/Voice:** Clear, straightforward textbook tone. Avoid dense blocks of text; use short paragraphs and clear framing to show how points connect.
  - start: 11
    end: 12
    rules: |
      - **Audience:** Ages 16-18. Average to below-average literacy / Advanced ESL.
      - **Vocabulary:** Retain the card's required academic terms, but keep the surrounding explanatory text highly accessible and direct. 
      - **Sentence Structure:** Maximum 25 words. Avoid overly dense, multi-clause academic sentences. Break complex thoughts into two shorter sentences.
      - **Tone/Voice:** Plain, formal English. Avoid academic fluff or passive voice that hides the main point. Deliver the card's precise data cleanly.