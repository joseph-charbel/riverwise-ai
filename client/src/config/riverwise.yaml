scenes:
    # ── Farm ──────────────────────────────────────────────────────────────
    - node_id: farm
      background_asset: assets/scenes/farm.webp
      hotspots:

          - id: info_farm_runoff
            type: info
            geometry: { shape: circle, x: 100, y: 387.5, r: 50 }
            title: Fertiliser and Runoff
            body: >-
                Farmers use fertiliser to help plants grow strong and healthy. If too much fertiliser is used, rain can wash it into nearby rivers. This is called runoff. Runoff can make river water dirty and unsafe, and it can harm fish and other animals. Using the right amount of fertiliser helps protect rivers.


            target_mechanic: Nutrient pollution and algal bloom formation.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: false
            fun_fact: Did you know? Too many nutrients in water can cause algae to grow quickly, which reduces oxygen for fish.

          - id: info_farm_irrigation
            type: info
            geometry: { shape: circle, x: 690, y: 400, r: 75 }
            title: Water Used for Farming
            body: >-
                Farmers use river water to grow crops. This is called irrigation. If the river water is dirty, it can carry germs and pollution onto fruits and vegetables. This can make food unsafe to eat unless it is properly cleaned. Clean water is important for both farming and health.


            target_mechanic: Water over-extraction and resulting habitat degradation.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

          - id: info_farm_soil
            type: info
            geometry: { shape: circle, x: 350, y: 480, r: 75 }
            title: How Farms Affect Rivers
            body: >-
                Water flowing off farms can carry soil, fertiliser, and waste into nearby rivers. This pollution can harm animals, plants, and people who depend on the river. Managing farm waste and runoff helps keep rivers clean.


            target_mechanic: Soil erosion leading to high turbidity and sunlight blockage.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: false
            fun_fact: Did you know? Cloudy water can block sunlight and harm plants and fish in the river.

          - id: info_farm_native_vegetation
            type: info
            geometry: { shape: circle, x: 640, y: 260, r: 50 }
            title: How Plants Help Keep Rivers Clean
            body: >-
                Plants and trees growing between farms and rivers help protect the water. Their roots catch dirt and soak up extra nutrients before they reach the river. This is an easy and effective way to keep rivers clean and healthy.


            target_mechanic: Natural filtration via riparian buffer vegetation.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

      questions:
          - question: Why do farmers use fertiliser?
            options:
                - To scare birds away
                - To help plants grow
                - To stop the rain
                - To make rivers dirty
            correct: 1

          - question: What is runoff?
            options:
                - Mud drying in the sun
                - Fish swimming quickly
                - Water washing dirt and fertiliser into the river
                - Rain stopping suddenly
            correct: 2

          - question: Why should fruits and vegetables be washed?
            options:
                - To make them sweeter
                - To make them bigger
                - Dirty water may have germs
                - To make them shiny
            correct: 2

          - question: How do plants near rivers help?
            options:
                - They make more rain
                - They stop fish from swimming
                - They make the river deeper
                - They keep dirt out of the river
            correct: 3

    # ── Village ───────────────────────────────────────────────────────────
    - node_id: village
      background_asset: assets/scenes/village.webp
      hotspots:

          - id: info_village_well
            type: info
            geometry: { shape: circle, x: 367.5, y: 340, r: 62.5 }
            title: Rain Carries Waste
            body: >-
                When rubbish is left on the ground, rainwater can wash it away. The water carries waste into drains, streams, and rivers. Poor waste management means more rubbish can end up polluting rivers.

            target_mechanic:  Runoff transporting waste into waterways during rain events.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: false
            fun_fact: null

          - id: info_village_waste
            type: info
            geometry: { shape: circle, x: 250, y: 380, r: 50 }
            title: Household Wastewater
            body: >-
                Water used in homes for washing clothes, dishes, and bathing is called wastewater. In many places, this water is not cleaned before being released into the environment. It can carry soap, dirt, and germs into rivers, making the water unsafe for people and animals.

            target_mechanic: Untreated domestic wastewater and pathogen introduction.

            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

          - id: info_village_bridge
            type: info
            geometry: { shape: circle, x: 432.5, y: 480, r: 62.5 }
            title: Medicines in Rivers
            body: >-
                Medicines should be thrown away carefully. If medicine is thrown away improperly, rainwater can carry it into rivers. Even small amounts of medicine can harm river plants and animals. Safe disposal helps protect the environment.

            target_mechanic: Pharmaceutical pollution from improper disposal.

            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

      questions:
          - question: What is wastewater?
            options:
                - Water from the mountains
                - Fresh drinking water
                - Water used for washing and cleaning
                - Rainwater from clouds
            correct: 2

          - question: What can rain do to rubbish on the ground?
            options:
                - Turn it into flowers
                - Wash it into rivers
                - Make it disappear
                - Turn it into food
            correct: 1

          - question: Why should medicine be thrown away safely?
            options:
                - It makes water cleaner
                - It makes rivers smell nice
                - It helps fish grow
                - It can harm river animals and plants
            correct: 3

          - question: What can household wastewater carry?
            options:
                - Clean drinking water
                - Only bubbles
                - Toys and books
                - Soap, dirt, and germs
            correct: 3

    # ── Kids Play Area ────────────────────────────────────────────────────
    - node_id: kids_play_area
      background_asset: assets/scenes/kids-play-area-cropped.webp
      hotspots:

          - id: info_kids_macroinvertebrates
            type: info
            geometry: { shape: circle, x: 165, y: 455, r: 45 }
            title: Plastic Pollution
            body: >-
                Rubbish such as plastic bottles, wrappers, and bags can end up near or in rivers. Plastic does not break down easily and can stay in the environment for many years. Animals like fish may mistake plastic for food, which can make them very sick. Plastic can also block rivers and trap small animals. To protect rivers, rubbish should always be thrown in the bin.


            target_mechanic: Impacts of plastic pollution on aquatic life and waterways.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: Did you know? A single plastic bottle can take hundreds of years to break down.

          - id: info_kids_safety
            type: info
            geometry: { shape: circle, x: 530, y: 460, r: 30 }
            title: Why Clean Rivers Matter
            body: >-
                Rivers are home to animals like fish and birds. These animals need clean water to survive and find food. When rubbish pollutes the river, it makes the water unsafe and harms the animals living there. Keeping rivers clean helps protect nature.


            target_mechanic: Rubbish in rivers damaging habitats
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

          #- id: info_kids_biodiversity
          #  type: info
          #  geometry: { shape: rect, x: 700, y: 150, w: 60, h: 60 }
          #  title: 
          #  body: >-
          #      Healthy rivers support an extraordinary web of life — fish,
          #      amphibians, birds, insects and plants all depend on clean,
          #      flowing water. When one species declines, ripple effects can
          #      disrupt the entire food chain.
          #      target_mechanic: Ecosystem interdependence and food web disruption.
          #      image_asset: assets/nodes/Square_-_black_simple-cropped.svg

          - id: info_kids_litter
            type: info
            geometry: { shape: circle, x: 240, y: 290, r: 50 }
            title: Rainwater and Drains
            body: >-
                When it rains, water flows into drains and pipes. This is called stormwater. In some places, stormwater goes straight into rivers without being cleaned. If rubbish or pollution enters the drain, it can be carried into the river and make the water dirty.


            target_mechanic: Microplastic degradation and wildlife ingestion.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: Did you know? Studies in Nepal show that many drains carry untreated wastewater straight into rivers like the Bagmati.

          # - id: info_kids_citizen_science
          #   type: info
          #   geometry: { shape: rect, x: 150, y: 100, w: 60, h: 60 }
          #   title: Citizen Science
          #   body: >-
          #       You don't need a lab to help — recording observations like water
          #       colour, smell, wildlife sightings and litter counts builds a
          #       valuable dataset. Schools and community groups feed this data
          #       into regional water quality databases used by scientists.
          #   target_mechanic: Community data collection for scientific monitoring.
          #   image_asset: assets/nodes/Square_-_black_simple-cropped.svg

      questions:
          - question: Where should plastic rubbish go?
            options:
                - In the river
                - Under a tree
                - In the bin
                - On the ground
            correct: 2

          - question: What can happen if fish eat plastic?
            options:
                - They grow bigger
                - They get sick
                - They swim faster
                - They change colour
            correct: 1

          - question: What is stormwater?
            options:
                - Water used for drinking
                - Water from a factory
                - Water from the ocean
                - Rainwater that goes into drains
            correct: 3

          - question: Why do rivers need to stay clean?
            options:
                - So rubbish can float away
                - So fish and animals can live safely
                - So the river gets bigger
                - So the water changes colour
            correct: 1

    # ── Temple ────────────────────────────────────────────────────────────
    - node_id: temple
      background_asset: assets/scenes/temple.webp
      hotspots:
          - id: info_temple_river_significance
            type: info
            geometry: { shape: circle, x: 655, y: 500, r: 50 }
            title: Rivers Are Life
            body: >-
                Rivers support both people and nature. Many rivers begin high in the mountains and flow through villages, farms, and cities. They provide water for drinking, growing food, and supporting animals and plants. Protecting rivers helps protect life.


            target_mechanic: Cultural stewardship and historical conservation ethics.
            include_example: true
            fun_fact: null

          - id: info_temple_everything_is_connected
            type: info
            geometry: { shape: circle, x: 862, y: 230, r: 44 }
            title: Everything Is Connected
            body: >-
                What happens in one part of the river affects everything downstream. Pollution from farms, factories, and villages can travel through the river and harm many communities, animals, and plants. Taking care of rivers in one place helps protect everyone.


            target_mechanic: Natural aeration generating dissolved oxygen.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

          - id: info_temple_our_role
            type: info
            geometry: { shape: circle, x: 285, y: 432, r: 52 }
            title: Our Role in Protecting Rivers
            body: >-
                Everyone can help protect rivers. Simple actions like throwing rubbish away properly, using water carefully, and keeping nature clean can make a big difference. When communities work together, rivers can stay healthy for future generations.


            target_mechanic: Environmental impact of biodegradable versus synthetic materials.
            include_example: true
            fun_fact: null

      questions:
          - question: Where do most rivers begin?
            options:
                - In houses
                - High in the mountains
                - In factories
                - In the ocean
            correct: 1

          - question: "Rivers give us water for:"
            options:
                - Playing games only
                - Making toys
                - Drinking and growing food
                - Only washing cars
            correct: 2

          - question: What happens if one part of the river gets polluted?
            options:
                - The water disappears
                - Pollution can affect other places too
                - Nothing happens
                - The river stops moving
            correct: 1

          - question: How can we help protect rivers?
            options:
                - Ignore pollution
                - Wash dirty things in the river
                - Throw waste away properly
                - Throw rubbish in the water
            correct: 2

    # ── Factories ─────────────────────────────────────────────────────────
    - node_id: factories
      background_asset: assets/scenes/factories.webp
      hotspots:

          - id: info_factories_discharge
            type: info
            geometry: { shape: circle, x: 395, y: 425, r: 25 }
            title: Industrial Wastewater
            body: >-
                Factories sometimes release wastewater into nearby rivers. This water can contain harmful chemicals, oils, and heavy metals. If the wastewater is not cleaned first, it can pollute rivers and make the water unsafe for people and animals. Cleaning factory waste helps protect the environment.

            target_mechanic: Heavy metal toxicity and bioaccumulation in food chains.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

          - id: info_factories_thermal
            type: info
            geometry: { shape: circle, x: 462.5, y: 490, r: 87.5 }
            title: How Pollution Changes Water
            body: >-
                When pollutants enter rivers, the water can become dark, cloudy, or smell bad. Rivers near cities and industrial areas can become heavily polluted if waste is not treated properly. Dirty water is unsafe for people and harmful to river ecosystems.

            target_mechanic: Thermal pollution reducing dissolved oxygen capacity.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: Did you know? Parts of Nepal's Bagmati River are heavily polluted due to untreated sewage and industrial waste.

          - id: info_factories_regulation
            type: info
            geometry: { shape: circle, x: 120, y: 182.5, r: 117.5 }
            title: Impact on Aquatic Life
            body: >-
                Pollution from factories can reduce oxygen in the water and introduce harmful chemicals. This can make fish and other river animals sick or even kill them. Clean water is important for aquatic life to survive.

            target_mechanic: Regulatory monitoring and penalty enforcement.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: null

          - id: info_factories_treatment
            type: info
            geometry: { shape: circle, x: 790, y: 350, r: 65 }
            title: Preventing Industrial Pollution
            body: >-
                Factories can help protect rivers by cleaning wastewater before releasing it. Wastewater treatment systems remove harmful substances from the water. Following environmental rules helps keep rivers safe for people and animals.

            target_mechanic: Contaminant removal via industrial wastewater treatment.
            # image_asset: assets/nodes/Square_-_black_simple-cropped.svg
            include_example: true
            fun_fact: Did you know? Wastewater treatment systems can remove many harmful substances before water is released.

      questions:
          - question: What can factories put into rivers if wastewater is not cleaned?
            options:
                - Fresh milk
                - Harmful chemicals
                - Clean drinking water
                - Fruit juice
            correct: 1

          - question: What can polluted river water look like?
            options:
                - Crystal clear
                - Sparkly gold
                - Dark or cloudy
                - Bright pink
            correct: 2

          - question: How can dirty factory water hurt fish?
            options:
                - It teaches them to swim faster
                - It makes them stronger
                - It helps them grow
                - It can make them sick or kill them
            correct: 3

          - question: What should factories do before releasing water?
            options:
                - Add more rubbish
                - Make it hotter
                - Clean the wastewater
                - Add soap
            correct: 2
